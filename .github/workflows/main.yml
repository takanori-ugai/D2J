# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Java CI

on: [push]

jobs:
  build:
    strategy:
        matrix:
          java_version: [17, 21, 25]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v6.2.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'temurin'
      - name: Build with Gradle & JDK ${{ matrix.java_version }}
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build with Gradle
        run: ./gradlew build -x detekt
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: takanori-ugai/D2J
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          annotate_only: true # Dependabot push workflows have a read-only token
          report_paths: '**/build/test-results/test/TEST-*.xml'
